name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AkitosVault
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Checkout AkitosCore
        uses: actions/checkout@v4
        with:
          repository: AkitoSekuna/AkitosCore
          ref: master
          path: AkitosCore

      - name: Build and install AkitosCore
        run: mvn -B clean install -f AkitosCore/pom.xml

      - name: Inspect local AkitosCore metadata
        run: |
          cat ~/.m2/repository/com/akito_sekuna/AkitosCore/maven-metadata-local.xml
          ls -la ~/.m2/repository/com/akito_sekuna/AkitosCore/

      - name: Build AkitosVault
        run: mvn -B -U clean package